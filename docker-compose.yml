services:
  # Backend - PHP 8.4 + Symfony
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: maintly-backend
    volumes:
      - ./backend:/var/www/html
      # ⚡ PERFORMANCE: vendor in Linux FS (not synced with Windows)
      - backend-vendor:/var/www/html/vendor
    # 🚀 TURBO: cache/logs in RAM (tmpfs)
    tmpfs:
      - /var/www/html/var/cache:mode=1777
      - /var/www/html/var/log:mode=1777
    environment:
      DATABASE_URL: "mysql://maintly:secret@mysql:3306/maintly?serverVersion=8.4"
      APP_ENV: "prod"
      APP_DEBUG: "0"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    depends_on:
      - mysql
    networks:
      - maintly-network

  # Nginx - Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: maintly-nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - maintly-network

  # MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: maintly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maintly
      MYSQL_USER: maintly
      MYSQL_PASSWORD: secret
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - maintly-network

  # Mailhog - Email testing (catches all outgoing emails)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: maintly-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - maintly-network

    # Frontend - React + Vite (DEV mode z hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: maintly-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./backend/ssl:/app/ssl:ro
    environment:
      # Backend API URL (z perspektywy przeglądarki, nie kontenera!)
      - VITE_API_URL=http://localhost:8000/api
      - VITE_API_URL_HTTPS=https://localhost:8443/api
      - VITE_WS_URL=ws://localhost:8000
      - VITE_USE_HTTPS=false
    depends_on:
      - nginx
    networks:
      - maintly-network
    stdin_open: true
    tty: true

  # Messenger Worker - Async queue consumer (reports, emails)
  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: maintly-messenger
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      DATABASE_URL: "mysql://maintly:secret@mysql:3306/maintly?serverVersion=8.4"
      APP_ENV: "prod"
      APP_DEBUG: "0"
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    restart: unless-stopped
    depends_on:
      - mysql
      - backend
    networks:
      - maintly-network

volumes:
  mysql-data:
  backend-vendor: # ⚡ Composer vendor - isolated from Windows (SZYBKOŚĆ!)
  frontend-node-modules: # ⚡ npm node_modules - isolated from Windows (SZYBKOŚĆ!)

networks:
  maintly-network:
    driver: bridge
