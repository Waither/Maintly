[www]
; PHP-FPM Pool Configuration for Maintly

user = www-data
group = www-data

listen = 9000

; Increase max children for better concurrency (was 5, causing bottleneck)
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Request timeouts
request_terminate_timeout = 60s
