framework:
    messenger:
        failure_transport: failed

        transports:
            # Synchronous transport for Commands and Queries (no worker needed)
            sync: 'sync://'
            
            # Async transport for background jobs (emails, reports, etc.) - will be used later
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # All Commands and Queries go to sync transport (no async needed)
            'App\Application\Command\*': sync
            'App\Application\Query\*': sync
            
            # Background jobs will go to async transport (later)
            # 'App\Message\*': async

        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            
            query.bus:
                middleware:
                    - validation

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                sync: 'in-memory://'

